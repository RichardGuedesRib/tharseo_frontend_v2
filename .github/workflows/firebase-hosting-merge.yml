name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  notify-start:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram - Workflow Started
        run: |
          COMMIT_LIST=$(git log --pretty=format:"%h - %s" -n 5) # 
          MESSAGE="🚀 Novidades! Um deploy do frontend web do Tharseo foi iniciado... Desenvolvedor ${{ github.event.head_commit.author.name }}. Commit(s): $COMMIT_LIST. A previsão do término é de 3 minutos."
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown"

  build_and_deploy:
    # needs: notify-start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copiar .env.production.example para .env
        run: cp .env.production.example .env

      - run:  npm ci && npm run build

      - name: List dist directory
        run: ls -R dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THARSEO_C8CB9 }}
          channelId: live
          projectId: tharseo-c8cb9
      
      # - name: ZAP Scan
      #   uses: zaproxy/action-full-scan@v0.10.0
      #   with:
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
      #     target: 'https://tharseocripto.web.app/'
      #     rules_file_name: '.zap/rules.tsv'
      #     cmd_options: '-a'
      #     allow_issue_writing: false
      #     artifact_name: 'zap_scan_report'

      - name: Notify Telegram - Deploy Success
        if: success()
        run: |
          MESSAGE="✅ Preview do frontend web do Tharseo realizado com sucesso! Verifique o resultado no Firebase Hosting em https://tharseocripto.web.app."
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown"

      - name: Notify Telegram - Deploy Failure
        if: failure()
        run: |
          MESSAGE="🚨 Ocorreu um erro durante o deploy do frontend do Tharseo. Verifique os logs do actions para maiores informações."
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown"
